name: Deploy to Render on Develop Push

on:
  push:
    branches:
      - develop

jobs:
  approve-develop:
    name: Wait for Develop Approval
    runs-on: ubuntu-latest
    environment:
      name: develop-deploy
    steps:
      - run: echo "Esperando aprobación manual para Develop..."

  deploy-dev:
    name: Trigger Render Deploy Hook
    needs: approve-develop
    runs-on: ubuntu-latest
    steps:
      - run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  qa-approval:
    name: Wait for QA Approval
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: qa-deploy
    steps:
      - run: echo "Esperando aprobación manual para QA..."

  promote-to-qa:
    needs: qa-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: qa
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - run: |
          git fetch origin develop
          git merge origin/develop --no-edit
          git push origin qa
      - run: curl -X POST ${{ secrets.RENDER_QA_DEPLOY_HOOK_URL }}
